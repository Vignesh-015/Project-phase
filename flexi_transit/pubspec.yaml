name: flexi_transit
description: "FlexiTransit-AI: Intelligent Multi-Modal Transit Engine for Chennai"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Map rendering (OpenStreetMap, no API key needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # HTTP & API
  http: ^1.2.2
  dio: ^5.7.0

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
